server {
    listen      80;
    listen      [::]:80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Compress text assets on the fly (the three.js bundle is ~1.3 MB uncompressed).
    gzip            on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml
        font/woff2;

    # Vite emits content-hashed files under /assets — safe to cache forever.
    location /assets/ {
        add_header  Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files  $uri =404;
    }

    # Never cache the entry HTML so a new deploy is picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Single-page app: send unmatched paths back through index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
